<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Swatch Deck — DEV.to preview</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
<style>
  :root{
    --bg:#0B0F1A; --panel:#111827; --panel-2:#0F172A; --line:#1F2A44;
    --ink:#E7E9EE; --ink-muted:#94A3B8; --primary:#00F5D4; --accent:#F15BB5; --support:#9B5DE5;
    --radius:14px; --maxw:820px;
  }
  html[data-theme="light"]{
    --bg:#F5F7F9; --panel:#FFFFFF; --panel-2:#EFF2F6; --line:#DDE3EC;
    --ink:#1B2333; --ink-muted:#5B6478; --primary:#0E7C86; --accent:#B4276F; --support:#6D3FBF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--primary)}
  header.top{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;
    padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.4px}
  .brand span{color:var(--primary)}
  .rule{display:flex;height:6px;width:150px;border-radius:99px;overflow:hidden}
  .rule i{flex:1}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:99px;padding:6px 14px}
  button:hover{border-color:var(--primary)}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:26px;padding:22px;align-items:start}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  nav.files{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px}
  nav.files h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);
    margin:6px 8px 8px}
  nav.files a{display:block;padding:9px 11px;border-radius:10px;text-decoration:none;color:var(--ink);
    font-size:14px;border:1px solid transparent}
  nav.files a:hover{background:var(--panel-2)}
  nav.files a.active{background:var(--panel-2);border-color:var(--primary);color:var(--primary)}
  nav.files small{display:block;color:var(--ink-muted);font-size:11.5px;margin-top:2px}
  article{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 0 48px;max-width:var(--maxw);width:100%;overflow:hidden}
  .cover{width:100%;display:block;border-bottom:1px solid var(--line)}
  .post{padding:0 clamp(18px,4vw,44px)}
  .meta{padding:22px clamp(18px,4vw,44px) 0}
  .meta h1{font-size:clamp(26px,4vw,40px);line-height:1.18;margin:.2em 0 .3em}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .tag{font-size:12.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .desc{color:var(--ink-muted);font-size:15px;margin:0 0 14px}
  .fm{font-size:12px;color:var(--ink-muted);border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);padding:8px 0;margin-bottom:22px}
  .post img{max-width:100%;vertical-align:top}
  .post h2{margin-top:1.9em;font-size:26px;border-bottom:1px solid var(--line);padding-bottom:.25em}
  .post h3{margin-top:1.5em;font-size:20px}
  .post blockquote{margin:1.4em 0;padding:.9em 1.1em;background:var(--panel-2);
    border-left:4px solid var(--accent);border-radius:0 10px 10px 0}
  .post blockquote p{margin:0}
  .post table{border-collapse:collapse;width:100%;margin:1.3em 0;font-size:14.5px;display:block;overflow-x:auto}
  .post th,.post td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .post th{background:var(--panel-2)}
  .post code{background:var(--panel-2);padding:.15em .4em;border-radius:6px;font-size:.9em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .post pre{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    overflow:auto;position:relative}
  .post pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}
  .post pre[data-lang]::before{content:attr(data-lang);position:absolute;top:0;right:0;
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#0B0F1A;background:var(--primary);
    padding:2px 10px;border-radius:0 11px 0 10px;font-family:ui-monospace,monospace}
  .post pre.lang-diff{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .post pre.lang-console{background:#05070d;border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
  .post pre.lang-console code{color:#9DF7E4}
  .post hr{border:0;border-top:1px solid var(--line);margin:2em 0}
  details.liquid{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;margin:1.4em 0}
  details.liquid summary{cursor:pointer;font-weight:650}
  .cta{display:block;text-align:center;margin:1.8em 0;padding:14px 20px;border-radius:12px;
    background:linear-gradient(90deg,var(--primary),var(--support));color:#08121A;font-weight:750;
    text-decoration:none}
  .katex-block{background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;
    padding:12px 16px;font-family:ui-monospace,monospace;color:var(--primary);margin:1.2em 0}
  .note{max-width:var(--maxw);margin:14px auto 0;color:var(--ink-muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Swatch<span>Deck</span> · DEV preview</div>
  <div class="rule"><i style="background:#0F172A"></i><i style="background:#00F5D4"></i><i style="background:#F15BB5"></i><i style="background:#9B5DE5"></i></div>
  <div class="spacer"></div>
  <button id="themeBtn">🌗 Theme</button>
</header>

<div class="layout">
  <nav class="files" id="nav"><h2>Articles</h2></nav>
  <div>
    <article id="article"><div class="post" style="padding-top:40px">Loading…</div></article>
    <p class="note">Local preview only. Liquid tags are simulated; on DEV.to they render natively.</p>
  </div>
</div>

<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js';
import hljs from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js';
import css from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/css.min.js';
import js from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/javascript.min.js';
import ts from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/typescript.min.js';
import json from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/json.min.js';
import scss from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/scss.min.js';
import xml from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/xml.min.js';
import bash from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/bash.min.js';
import diff from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/diff.min.js';
import python from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/python.min.js';
import php from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/php.min.js';
import yaml from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/languages/yaml.min.js';

for (const [n, l] of Object.entries({ css, javascript: js, typescript: ts, json, scss, xml, bash, diff, python, php, yaml })) {
  hljs.registerLanguage(n, l);
}
const ALIAS = { js: 'javascript', ts: 'typescript', jsonc: 'json', html: 'xml', console: 'bash', liquid: 'xml', markdown: 'xml' };

const FILES = [
  ['00-swatch-deck-theme-kit.md', 'Reusable theme kit'],
  ['01-colorfiind-developer-tour.md', 'Feature tour'],
  ['02-hex-to-design-tokens.md', 'Tokens pipeline'],
  ['03-seasonal-palettes-ui-themes.md', 'Seasonal themes'],
  ['04-neon-dark-mode-glow-ui.md', 'Neon dark mode'],
  ['05-automate-palette-workflow.md', 'Automation'],
];

const nav = document.getElementById('nav');
FILES.forEach(([file, sub]) => {
  const a = document.createElement('a');
  a.href = '#' + file;
  a.innerHTML = `${file.replace(/^\d+-/, '').replace(/\.md$/, '')}<small>${sub}</small>`;
  a.dataset.file = file;
  nav.appendChild(a);
});

function parseFrontMatter(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { data: {}, body: text };
  const data = {};
  for (const line of m[1].split('\n')) {
    const i = line.indexOf(':');
    if (i > 0) data[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^"|"$/g, '');
  }
  return { data, body: text.slice(m[0].length) };
}

function liquid(md) {
  return md
    .replace(/\{%\s*(?:details|spoiler|collapsible)\s+([\s\S]*?)%\}/g,
      (_, s) => `<details class="liquid" open><summary>${s.trim()}</summary>\n\n`)
    .replace(/\{%\s*end(?:details|spoiler|collapsible)\s*%\}/g, '\n</details>\n')
    .replace(/\{%\s*cta\s+(\S+)\s*%\}([\s\S]*?)\{%\s*endcta\s*%\}/g,
      (_, href, label) => `<a class="cta" href="${href}" target="_blank" rel="noopener">${label.trim()}</a>`)
    .replace(/\{%\s*katex(?:\s+inline)?\s*%\}([\s\S]*?)\{%\s*endkatex\s*%\}/g,
      (_, tex) => `<div class="katex-block">${tex.trim().replace(/</g, '&lt;')}</div>`)
    .replace(/\{%\s*embed\s+(\S+)\s*%\}/g, (_, u) => `<p><a href="${u}">${u}</a></p>`);
}

marked.setOptions({ gfm: true, breaks: false });

async function render(file) {
  const res = await fetch('./' + file + '?v=' + Date.now());
  const raw = await res.text();
  const { data, body } = parseFrontMatter(raw);
  const html = marked.parse(liquid(body));

  const cover = data.cover_image
    ? `<img class="cover" src="${data.cover_image}" alt="cover" />` : '';
  const tags = (data.tags || '').split(',').filter(Boolean)
    .map((t) => `<span class="tag">#${t.trim()}</span>`).join('');

  document.getElementById('article').innerHTML = `
    ${cover}
    <div class="meta">
      <div class="tags">${tags}</div>
      <h1>${data.title || file}</h1>
      <p class="desc">${data.description || ''}</p>
      <div class="fm">published: <b>${data.published ?? 'false'}</b> · cover_image: ${data.cover_image ? 'set' : 'none'} · tags: ${(data.tags || '').split(',').length}/4</div>
    </div>
    <div class="post">${html}</div>`;

  document.querySelectorAll('.post pre code').forEach((el) => {
    const raw = (el.className.match(/language-(\w+)/) || [])[1] || '';
    const lang = ALIAS[raw] || raw;
    el.parentElement.dataset.lang = raw || 'text';
    el.parentElement.classList.add('lang-' + (raw || 'text'));
    if (lang && hljs.getLanguage(lang)) {
      el.innerHTML = hljs.highlight(el.textContent, { language: lang }).value;
    }
  });

  document.querySelectorAll('nav.files a').forEach((a) =>
    a.classList.toggle('active', a.dataset.file === file));
  window.scrollTo({ top: 0 });
}

const load = () => render((location.hash || '#' + FILES[1][0]).slice(1));
window.addEventListener('hashchange', load);
load();

document.getElementById('themeBtn').onclick = () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
};
</script>
</body>
</html>
