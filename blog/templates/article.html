<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}{{META_TITLE_SUFFIX}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="keywords" content="{{META_KEYWORDS}}">
    <meta name="robots" content="index, follow">
    {{DRAFT_META}}
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":"{{TITLE}}","description":"{{META_DESCRIPTION}}","image":"{{OG_IMAGE}}","datePublished":"{{PUBLISHED_DATE}}","author":{"@type":"Person","name":"{{AUTHOR}}"},"publisher":{"@type":"Organization","name":"{{SITE_NAME}}"},"mainEntityOfPage":"{{ARTICLE_URL}}"}</script>
    
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:url" content="{{ARTICLE_URL}}">
    <meta property="og:site_name" content="{{SITE_NAME}}">
    <meta property="article:published_time" content="{{PUBLISHED_DATE}}">
    <meta property="article:section" content="{{CATEGORY}}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="{{TWITTER_HANDLE}}">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    
    <!-- Canonical -->
    <link rel="canonical" href="{{ARTICLE_URL}}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="{{SITE_NAME}}" href="{{SITE_URL}}/rss.xml">
    
    <style>
        :root {
            --primary: {{PRIMARY_COLOR}};
            --text: #0f172a;
            --text-muted: #64748b;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --font: {{FONT_FAMILY}};
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            color: var(--text);
            background: var(--bg);
            line-height: 1.7;
            font-size: 16px;
        }
        
        /* ===== HEADER ===== */
        .blog-header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .blog-header-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .blog-logo {
            font-family: var(--font);
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .blog-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 24px;
        }
        .blog-nav a:hover { color: var(--primary); }
        
        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            max-width: 860px;
            margin: 24px auto 0;
            padding: 0 24px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb span { margin: 0 6px; }
        
        /* ===== HERO: HEADING LEFT + IMAGE RIGHT ===== */
        .article-hero {
            max-width: 1140px;
            margin: 40px auto 0;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .hero-category {
            display: inline-block;
            background: rgba(27, 87, 246, 0.1);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
            width: fit-content;
        }
        .hero-title {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .hero-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .hero-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .hero-image {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        
        /* ===== ARTICLE CONTENT (full-width, centered) ===== */
        .article-body {
            max-width: 860px;
            margin: 48px auto;
            padding: 0 24px;
        }
        .article-body h1 { font-size: 2rem; font-weight: 800; margin: 2rem 0 1rem; color: var(--text); text-align: center; }
        .article-body h2 { font-size: 1.5rem; font-weight: 700; margin: 2rem 0 0.75rem; color: var(--text); }
        .article-body h3 { font-size: 1.2rem; font-weight: 700; margin: 1.5rem 0 0.5rem; color: var(--text); }
        .article-body p { margin: 0 0 1.2rem; text-align: justify; line-height: 1.8; color: #334155; }
        .article-body ul, .article-body ol { margin: 0 0 1.2rem 1.5rem; }
        .article-body li { margin: 0.4rem 0; line-height: 1.7; color: #334155; }
        .article-body a { color: var(--primary); text-decoration: underline; font-weight: 600; }
        .article-body a:hover { color: var(--primary); }
        .article-body blockquote {
            border-left: 4px solid var(--primary);
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            background: var(--bg-light);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: var(--text-muted);
        }
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1.5rem 0;
        }
        .article-body .blog-thumbnail { width: 100%; }
        .article-body .blog-thumbnail img { width: 100%; border-radius: 12px; }
        .article-body code {
            background: var(--bg-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .article-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }
        .article-body th, .article-body td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
        }
        .article-body th { background: var(--bg-light); font-weight: 700; }
        
        /* ===== TAGS ===== */
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .tag {
            background: var(--bg-light);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border);
        }
        .tag:hover { color: var(--primary); border-color: var(--primary); }
        
        /* ===== SHARE BUTTONS ===== */
        .share-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 1.5rem;
        }
        .share-label { font-weight: 700; font-size: 0.85rem; color: var(--text-muted); }
        .share-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .share-btn:hover { transform: scale(1.1); }
        .share-twitter { background: #000; }
        .share-linkedin { background: #0077b5; }
        .share-facebook { background: #1877f2; }
        .share-copy { background: var(--text-muted); cursor: pointer; }
        
        /* ===== RELATED POSTS ===== */
        .related-posts {
            max-width: 860px;
            margin: 3rem auto;
            padding: 0 24px;
        }
        .related-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .related-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-decoration: none;
            color: var(--text);
            transition: box-shadow 0.2s;
        }
        .related-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .related-card h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.3rem; }
        .related-card small { color: var(--text-muted); font-size: 0.78rem; }
        
        /* ===== FOOTER ===== */
        .blog-footer {
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .blog-footer a { color: var(--primary); text-decoration: none; }
        
        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 768px) {
            .article-hero {
                grid-template-columns: 1fr;
                gap: 24px;
                margin-top: 24px;
            }
            .hero-title { font-size: 1.6rem; }
            .hero-image { aspect-ratio: 16/9; }
            .article-body { margin: 32px auto; }
            .article-body h2 { font-size: 1.25rem; }
            .related-grid { grid-template-columns: 1fr; }
            .blog-header-inner { padding: 0 16px; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
{{HEADER}}
<div class="blog-header">
    <div class="blog-header-inner">
        <a href="/blog/" class="blog-logo">{{SITE_NAME}}</a>
        <nav class="blog-nav">
            <a href="/blog/">All Posts</a>
            <a href="/blog/category/General/">Categories</a>
            <a href="/blog/rss.xml">RSS</a>
        </nav>
    </div>
</div>

<!-- BREADCRUMB -->
{{BREADCRUMB}}

<!-- HERO: Heading LEFT + Image RIGHT -->
<div class="article-hero">
    <div class="hero-text">
        <a href="/blog/category/{{CATEGORY}}/" class="hero-category">{{CATEGORY}}</a>
        <h1 class="hero-title">{{TITLE}}</h1>
        <div class="hero-meta">
            <span>📅 {{PUBLISHED_DATE_FORMATTED}}</span>
            <span>⏱️ {{READING_TIME}} min read</span>
            <span>✍️ {{AUTHOR}}</span>
        </div>
    </div>
    <img src="{{THUMBNAIL_URL}}" alt="{{TITLE}}" class="hero-image" loading="eager">
</div>

<!-- ARTICLE CONTENT (full-width, centered) -->
<article class="article-body">
    {{CONTENT_HTML}}
    
    {{TAGS_HTML}}
    {{SHARE_BUTTONS}}
</article>

<!-- RELATED POSTS -->
{{RELATED_POSTS}}

<!-- FOOTER -->
{{FOOTER}}
<div class="blog-footer">
    {{FOOTER_TEXT}}
</div>

<script>
// Related posts loader
(function() {
    var el = document.getElementById('related-posts');
    if (!el) return;
    var cat = el.dataset.category;
    var exclude = el.dataset.exclude;
    // Fetch related posts from API
    fetch('/blog/api/related?category=' + encodeURIComponent(cat) + '&exclude=' + encodeURIComponent(exclude))
        .then(r => r.json())
        .then(data => {
            var grid = document.getElementById('related-grid');
            if (data.posts && data.posts.length > 0) {
                grid.innerHTML = data.posts.map(p => 
                    '<a href="' + p.url + '" class="related-card">' +
                    '<h4>' + p.title + '</h4>' +
                    '<small>' + p.published_date + ' · ' + p.reading_time + ' min</small>' +
                    '</a>'
                ).join('');
            } else {
                grid.innerHTML = '';
                el.style.display = 'none';
            }
        })
        .catch(() => { el.style.display = 'none'; });
})();
</script>

</body>
</html>
